[manifest]
version = "1.0.0"
dump_lua = true
priority = 2147483600

[[patches]]
[patches.regex]
target = "game.lua"
pattern = '''function Game:update_round_eval\(dt\)(?<pre>[\s\S]+?)if not G.STATE_COMPLETE then'''
position = 'at'
payload = '''function Game:update_round_eval(dt)$pre if not G.STATE_COMPLETE and not (PVP.is_mp_or_practice() and PVP.GAME.prevent_eval) then
        PVP.GAME.prevent_eval = PVP.is_mp_or_practice() or nil'''
times = 1

[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = '''dollars = dollars + G.GAME.interest_amount*math.min(math.floor(G.GAME.dollars/5), G.GAME.interest_cap/5)
    end'''
position = 'after'
payload = '''
  if PVP.in_session() and not PVP.GAME.comeback_bonus_given then
		PVP.GAME.comeback_bonus_given = true
		local comeback_bonus

		if PVP.LOBBY.config.ruleset == "ruleset_mp_sandbox" then
		    comeback_bonus = 3 * (G.GAME.round_resets.ante - 1)
		else
			if PVP.is_major_league_ruleset() then 
				comeback_bonus = 4 * PVP.GAME.comeback_bonus
			else
				if G.GAME.stake >= 6 then
					comeback_bonus = 2
				else
			    	comeback_bonus = 4
				end
			end
		end

		add_round_eval_row({
			bonus = true,
			name = "comeback",
			pitch = pitch,
			dollars = comeback_bonus,
		})
		dollars = dollars + comeback_bonus
	end'''
match_indent = false
times = 1

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = '''elseif config.name == 'hands' then'''
position = 'before'
payload = '''elseif config.name == "comeback" then
  local bonus
  if PVP.LOBBY.config.ruleset == "ruleset_mp_sandbox" then
	bonus = G.GAME.round_resets.ante - 1
  else
	bonus = PVP.GAME.comeback_bonus
  end
  table.insert(left_text, {
    n = G.UIT.T,
    config = {
      text = bonus,
      scale = 0.8 * scale,
      colour = G.C.PURPLE,
      shadow = true,
      juice = true,
    },
  })

  local comeback_money_key = PVP.LOBBY.config.ruleset == "ruleset_mp_sandbox" and "k_comeback_money_sandbox" or "k_total_lives_lost"
  table.insert(left_text, {
    n = G.UIT.O,
    config = {
      object = DynaText({
        string = {
          localize(comeback_money_key),
        },
        colours = { G.C.UI.TEXT_LIGHT },
        shadow = true,
        pop_in = 0,
        scale = 0.4 * scale,
        silent = true,
      }),
    },
  })'''
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = '''if G.GAME.current_round.hands_left > 0 and not G.GAME.modifiers.no_extra_hand_money then'''
position = 'at'
payload = '''if G.GAME.current_round.hands_left > 0 and (not G.GAME.modifiers.no_extra_hand_money) and (not PVP.is_pvp_boss()) then'''
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = '''G.GAME.current_round.hands_left = G.GAME.current_round.hands_left + mod'''
position = 'after'
payload = '''if PVP.LOBBY.code and PVP.is_pvp_boss() and mod > 0 then
		PVP.ACTIONS.play_hand(G.GAME.chips, G.GAME.current_round.hands_left)
	end'''
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = '''G.FUNCS.toggle_shop = function(e)'''
position = 'after'
# §18.2: tell the opponent how much we spent this shop visit -- any of their
# cards watching for opponent_spent_in_shop (e.g. Penny Pincher) reacts via
# their own calculate.
payload = '''if PVP.LOBBY.code then
  MPAPI.broadcast_opponent_context({ opponent_spent_in_shop = to_number(to_big(PVP.GAME.spent_total) - to_big(PVP.GAME.spent_before_shop)) })
end'''
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = '''G.GAME.dollars = G.GAME.dollars + mod'''
position = 'after'
payload = '''if PVP.LOBBY.code and to_big(mod) < to_big(0) then
  PVP.GAME.spent_total = to_big(PVP.GAME.spent_total) + (to_big(mod) * to_big(-1))
end'''
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
pattern = '''if G.GAME.chips - G.GAME.blind.chips >= 0 then
add_round_eval_row({dollars = G.GAME.blind.dollars, name='blind1', pitch = pitch})'''
position = 'at'
payload = '''if G.GAME.chips - G.GAME.blind.chips >= 0 or PVP.is_pvp_boss() then
add_round_eval_row({dollars = G.GAME.blind.dollars, name='blind1', pitch = pitch})'''
match_indent = true
times = 1

# Filter grim/familiar/incantation's enhancement roll by spectral_banned_enhancements
# (independent of banned_enhancements / G.GAME.banned_keys).
[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/game_object.lua"]'''
pattern = '''for k, v in pairs(G.P_CENTER_POOLS["Enhanced"]) do'''
position = "at"
payload = '''
for i, v in ipairs(PVP.UTILS.get_spectral_enhancement_pool()) do
'''
match_indent = true
times = 3

# Stop game from replacing the multiplayer "ready up" button with "select blind" button
[[patches]]
[patches.pattern]
target = '''functions/button_callbacks.lua'''
pattern = """_top_button.config.button = 'select_blind'"""
position = "at"
payload = '''
if _top_button.config.button ~= "mp_toggle_ready" then
	_top_button.config.button = "select_blind"
end
'''
match_indent = true
times = 1



