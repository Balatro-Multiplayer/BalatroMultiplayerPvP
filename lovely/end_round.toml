# Handles all the assorted end_round behaviour in many patches, in an attempt to preserve compatibility where possible
[manifest]
version = "1.0.0"
dump_lua = true
priority = 2147483600

# handle duplicate end
[[patches]]
[patches.regex]
target = "functions/state_events.lua"
pattern = '''function end_round\(\)(?<pre>[\s\S]+?)func = function\(\)'''
position = 'after'
payload = '''
if PVP.handle_duplicate_end() then
	return true
end
if PVP.LOBBY.code then
	PVP.GAME.round_ended = true
end
'''
times = 1

# water is wet
# the game over code was ripped out from the original function. here? it just shouldn't run, i think
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = '''-- context.end_of_round calculations'''
position = 'before'
payload = '''
if PVP.is_mp_or_practice() then
	game_over = false
end
'''
match_indent = true
times = 1

# prevent winning (i don't know if this is needed)
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = '''if game_over then'''
position = 'before'
payload = '''
if PVP.is_mp_or_practice() then
	game_won = nil
	G.GAME.won = nil
end
'''
match_indent = true
times = 1

# handle deck out
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = '''G.FUNCS.draw_from_discard_to_deck()'''
position = 'after'
payload = '''
PVP.handle_deck_out()
'''
match_indent = true
times = 1

## survival mode things

# define local var
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = '''
G.STATE = G.STATES.ROUND_EVAL
G.STATE_COMPLETE = false
'''
position = 'after'
payload = '''
local temp_furthest_blind = 0
'''
match_indent = true
times = 1

# small
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = '''
G.GAME.round_resets.blind_states.Small = 'Defeated'
'''
position = 'after'
payload = '''
temp_furthest_blind = G.GAME.round_resets.ante * 10 + 1
'''
match_indent = true
times = 1

# big
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = '''
G.GAME.round_resets.blind_states.Big = 'Defeated'
'''
position = 'after'
payload = '''
temp_furthest_blind = G.GAME.round_resets.ante * 10 + 2
'''
match_indent = true
times = 1

# boss
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = '''
G.GAME.round_resets.blind_states.Boss = 'Defeated'
'''
position = 'after'
payload = '''
temp_furthest_blind = (G.GAME.round_resets.ante - 1) * 10 + 3
'''
match_indent = true
times = 1

# set furthest blind and pincher index
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = '''
if G.GAME.round_resets.temp_handsize then G.hand:change_size(-G.GAME.round_resets.temp_handsize); G.GAME.round_resets.temp_handsize = nil end
'''
position = 'before'
payload = '''
if PVP.LOBBY.code then
	PVP.GAME.furthest_blind = (temp_furthest_blind > PVP.GAME.furthest_blind) and temp_furthest_blind or PVP.GAME.furthest_blind
	PVP.ACTIONS.set_furthest_blind(PVP.GAME.furthest_blind)
end
'''
match_indent = true
times = 1

# ease_ante event suppression for compatibility
[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = '''
function ease_ante(mod)
'''
position = 'after'
payload = '''
if PVP.is_mp_or_practice() and not PVP.LOBBY.config.disable_live_and_timer_hud then
	PVP.suppress_next_event = true
end
'''
match_indent = true
times = 1

## showdown mode thing

# spoof nemesis blind so it works fine with the condition later
# this is bad but uhhhhh it's fine
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = '''
G.STATE = G.STATES.ROUND_EVAL
G.STATE_COMPLETE = false
'''
position = 'after'
payload = '''
local mp_nemesis_spoof = false
if G.GAME.round_resets.blind == G.P_BLINDS.bl_mp_nemesis then
	mp_nemesis_spoof = true
	if G.GAME.blind_on_deck == "Small" then
		G.GAME.round_resets.blind = G.P_BLINDS.bl_small
	elseif G.GAME.blind_on_deck == "Big" then
		G.GAME.round_resets.blind = G.P_BLINDS.bl_big
	else
		mp_nemesis_spoof = false
	end
end
'''
match_indent = true
times = 1

# back to normal
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = '''
if G.GAME.round_resets.temp_handsize then G.hand:change_size(-G.GAME.round_resets.temp_handsize); G.GAME.round_resets.temp_handsize = nil end
'''
position = 'before'
payload = '''
if mp_nemesis_spoof then
	G.GAME.round_resets.blind = G.P_BLINDS.bl_mp_nemesis
end
'''
match_indent = true
times = 1

# same patches but for a different part of the code (new_round)
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = '''
G.GAME.round_bonus.discards = 0
'''
position = 'after'
payload = '''
local mp_nemesis_spoof = false
if G.GAME.round_resets.blind == G.P_BLINDS.bl_mp_nemesis then
	mp_nemesis_spoof = true
	if G.GAME.blind_on_deck == "Small" then
		G.GAME.round_resets.blind = G.P_BLINDS.bl_small
	elseif G.GAME.blind_on_deck == "Big" then
		G.GAME.round_resets.blind = G.P_BLINDS.bl_big
	else
		mp_nemesis_spoof = false
	end
end
'''
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = '''
G.GAME.blind:set_blind(G.GAME.round_resets.blind)
'''
position = 'before'
payload = '''
if mp_nemesis_spoof then
	G.GAME.round_resets.blind = G.P_BLINDS.bl_mp_nemesis
end
'''
match_indent = true
times = 1