[manifest]
version = "1.0.0"
dump_lua = true
priority = 2147483600

[[patches]]
[patches.regex]
target = "card.lua"
pattern = '''\) then self.cost = 0 end'''
position = 'after'
payload = '''if PVP.is_phantom(self) then self.sell_cost = 0 end'''
times = 1

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''if G.jokers.cards[i] ~= self then'''
position = 'at'
payload = '''if G.jokers.cards[i] ~= self and not PVP.is_phantom(G.jokers.cards[i]) then'''
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''local chosen_joker = pseudorandom_element(G.jokers.cards, pseudoseed('ankh_choice'))'''
position = 'at'
payload = '''local copyable_jokers = {}
    for i, v in ipairs(G.jokers.cards) do
      if not PVP.is_phantom(G.jokers.cards[i]) then copyable_jokers[#copyable_jokers + 1] = v end
    end
    local chosen_joker = pseudorandom_element(copyable_jokers, pseudoseed('ankh_choice'))'''
match_indent = true
times = 1

[[patches]]
[patches.regex]
target = "card.lua"
pattern = '''--if there is at least one joker(?<pre>[\s\S]+?)for k, v in pairs\(G.jokers.cards\) do'''
position = 'at'
payload = '''--if there is at least one joker$pre local copyable_jokers = {}
      for i, v in ipairs(G.jokers.cards) do
        if not PVP.is_phantom(G.jokers.cards[i]) then copyable_jokers[#copyable_jokers + 1] = v end
      end
      for k, v in pairs(copyable_jokers) do'''
times = 1

# Sets the balanced sticker on reworked cards.
# ReworkCenter mutation should automatically set card.config.mp_balanced if applicable
# Custom localization is unsupported as of now
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''if center.consumeable then'''
position = 'before'
payload = '''
if old_center ~= center or initial then
	self.ability.mp_sticker_balanced = false
	if center.config.mp_balanced then
		self.ability.mp_sticker_balanced = true
	end
end'''
match_indent = true
times = 1

# Fixes the issue with baseball card working on phantom jokers
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''if self.ability.name == 'Baseball Card' and self ~= context.other_joker and context.other_joker:is_rarity("Uncommon") then'''
position = 'after'
payload = '''if PVP.is_phantom(context.other_joker) then return end'''
match_indent = true
times = 1